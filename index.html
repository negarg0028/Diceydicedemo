<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dicey Dice</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fff7df;
      --ink: #201c1c;
      --muted: #6d625d;
      --line: #dbc9a9;
      --panel: #fffdf4;
      --panel-2: #f8efe0;
      --orange: #f36d1f;
      --amber: #f5ae3c;
      --peach: #f7c09d;
      --green: #177a4a;
      --red: #b3382c;
      --blue: #315f9f;
      --shadow: 0 18px 40px rgba(72, 48, 20, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(243, 109, 31, 0.10), transparent 28rem),
        linear-gradient(135deg, #fff9e9, #f6e8cc 62%, #fff3db);
      color: var(--ink);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      width: min(1460px, 100%);
      margin: 0 auto;
      padding: 22px;
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(190px, 1fr);
      gap: 20px;
      align-items: start;
    }

    .topbar {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 760px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 8px;
      min-height: 42px;
      padding: 10px 14px;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(32, 28, 28, 0.08);
    }

    .btn:hover {
      background: #fff7e7;
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.48;
      box-shadow: none;
    }

    .btn-primary {
      background: var(--ink);
      color: #fffdf6;
      border-color: var(--ink);
    }

    .btn-primary:hover {
      background: #3a302d;
    }

    .btn-danger {
      color: var(--red);
    }

    .board-shell,
    .side-panel {
      background: rgba(255, 253, 244, 0.86);
      border: 1px solid rgba(219, 201, 169, 0.9);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .board-shell {
      padding: 14px;
    }

    .board-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1504 / 1248;
      overflow: hidden;
      border-radius: 6px;
      background: var(--paper);
      border: 1px solid rgba(121, 88, 54, 0.18);
    }

    .board-scene {
      position: absolute;
      inset: 0;
      transform: none;
      transform-origin: 50% 50%;
    }

    .board-scene img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
    }

    .space {
      --size: clamp(24px, 2.6vw, 34px);
      position: absolute;
      left: var(--x);
      top: var(--y);
      transform: translate(-50%, -50%);
      width: var(--size);
      height: var(--size);
      border-radius: 999px;
      border: 2px solid transparent;
      background: transparent;
      color: var(--ink);
      font-weight: 800;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: none;
      transition: transform 150ms ease, background 150ms ease, border-color 150ms ease;
      z-index: 2;
    }

    .space .space-label {
      opacity: 0;
    }

    .space.special-space {
      width: clamp(48px, 5vw, 62px);
      height: clamp(28px, 3vw, 38px);
      border-radius: 999px;
      font-size: 13px;
      line-height: 1;
    }

    .space.special-space .space-label {
      opacity: 0;
    }

    /* Enlarged transparent hit area for the Odd betting space only. */
    .space[data-key="odd"] {
      /* The ODD label is on the bottom edge of the board image. */
      left: 50%;
      top: 94%;
      width: clamp(120px, 11vw, 150px);
      height: clamp(54px, 5vw, 70px);
      z-index: 10;
      pointer-events: auto;
    }

    .space:hover,
    .space:focus-visible {
      transform: translate(-50%, -50%);
      background: transparent;
      border-color: transparent;
    }

    .space.is-winner {
      background: rgba(255, 225, 55, 0.38);
      border-color: #c68b00;
      outline: none;
      box-shadow: none;
    }

    .board-token {
      position: absolute;
      left: var(--x);
      top: var(--y);
      transform: translate(-50%, -50%);
      width: clamp(21px, 1.575vw, 28.5px);
      height: clamp(21px, 1.575vw, 28.5px);
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--player-color);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      border: 1.5px solid #fffdf4;
      box-shadow: 0 1px 3px rgba(32, 28, 28, 0.18);
      cursor: pointer;
      pointer-events: auto;
      z-index: 6;
    }

    .board-token.win {
      outline: 1px solid rgba(255, 240, 106, 0.85);
      box-shadow: 0 0 0 1px rgba(35, 137, 75, 0.10), 0 1px 3px rgba(32, 28, 28, 0.18);
    }
    .board-token.removable:hover {
      transform: translate(-50%, -50%) scale(1.12);
      outline: 1px dashed rgba(32, 28, 28, 0.7);
    }
    .board-token.locked { cursor: default; }

    .board-dice {
      position: static;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      width: fit-content;
      max-width: 100%;
      margin: 10px 0 0 auto;
      background: rgba(255, 253, 244, 0.94);
      border: 1px solid rgba(219, 201, 169, 0.95);
      border-radius: 8px;
      padding: 8px;
      box-shadow: 0 3px 8px rgba(32, 28, 28, 0.10);
    }

    .board-footer {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat strong {
      display: block;
      margin-top: 4px;
      font-size: 22px;
      line-height: 1.1;
    }

    .side-panel {
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .section-title {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.2;
    }

    .players {
      display: grid;
      gap: 10px;
    }

    .player-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .player-card.active {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(32, 28, 28, 0.10);
    }

    .player-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }

    .player-name {
      font-weight: 800;
    }

    .balance {
      font-size: 20px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .mini {
      color: var(--muted);
      font-size: 13px;
    }

    .player-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .bid-list {
      display: grid;
      gap: 6px;
      min-height: 25px;
    }

    .bid-pill {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      background: #fff8ea;
      border: 1px solid #ead9b7;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 13px;
    }

    .bid-pill.win {
      border-color: rgba(23, 122, 74, 0.55);
      background: rgba(23, 122, 74, 0.10);
    }

    .bid-pill.loss {
      border-color: rgba(179, 56, 44, 0.35);
      background: rgba(179, 56, 44, 0.08);
    }

    .dice-area {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(135deg, #fffdf4, #fff3d6);
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .dice-row {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .dice {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .die {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #fffdfb;
      border: 2px solid var(--ink);
      font-size: 30px;
      font-weight: 900;
      box-shadow: 0 5px 0 rgba(32, 28, 28, 0.14);
      font-variant-numeric: tabular-nums;
    }

    .board-dice .die {
      width: 44px;
      height: 44px;
      font-size: 24px;
    }

    .result {
      font-weight: 800;
      color: var(--green);
    }

    .log {
      max-height: 170px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 244, 0.72);
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .log-entry {
      font-size: 13px;
      color: var(--muted);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(20, 16, 12, 0.42);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal.open {
      display: flex;
    }

    .dialog {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .dialog h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .field {
      margin-top: 14px;
      display: grid;
      gap: 6px;
    }

    .field label {
      font-weight: 700;
    }

    .field input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      background: #fffdfb;
      color: var(--ink);
    }

    .bid-options {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .bid-option {
      min-height: 48px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff8ea;
      color: var(--ink);
      cursor: pointer;
      font-weight: 800;
      box-shadow: 0 2px 0 rgba(32, 28, 28, 0.08);
    }

    .bid-option:hover,
    .bid-option:focus-visible {
      background: #ffffff;
    }

    .bid-option:disabled {
      cursor: not-allowed;
      opacity: 0.42;
      box-shadow: none;
    }

    .dialog-actions {
      margin-top: 16px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .error {
      color: var(--red);
      min-height: 20px;
      font-size: 14px;
    }

    /* Desktop presentation layout: keep the complete board and player bids in view at 100% zoom. */
    @media (min-width: 761px) {
      .app {
        width: 100%;
        max-width: none;
        padding: 14px 18px;
        grid-template-columns: minmax(0, 1fr) minmax(340px, 24vw);
        gap: 16px;
      }

      .topbar { gap: 20px; }
      h1 { font-size: clamp(30px, 3.2vw, 44px); }
      .subtitle { font-size: 15px; max-width: 720px; }

      .board-shell { padding: 10px; }
      .board-token { font-size: 12px; border-width: 2px; }
      .board-wrap {
        width: min(100%, calc((100vh - 250px) * 1.205128));
        height: auto;
        aspect-ratio: 1504 / 1248;
        margin: 0 auto;
      }

      .board-footer { margin-top: 8px; gap: 8px; }
      .stat { padding: 7px 9px; }
      .stat strong { font-size: 18px; }

      .side-panel {
        max-height: calc(100vh - 150px);
        overflow-y: auto;
        padding: 12px;
        gap: 10px;
        scrollbar-gutter: stable;
      }
      .player-card { padding: 10px; gap: 7px; }
      .player-head { gap: 6px; }
      .bid-row { padding: 7px 9px; }
      .section-title { margin-bottom: 6px; }
    }

    @media (max-width: 760px) {
      .app {
        grid-template-columns: minmax(0, 3fr) minmax(170px, 1fr);
        gap: 10px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        justify-content: flex-start;
      }

      .subtitle {
        max-width: none;
      }

      .side-panel {
        gap: 10px;
      }

      .player-card {
        padding: 10px;
      }

      .player-head {
        display: grid;
        gap: 4px;
      }

      .balance {
        font-size: 16px;
      }
    }

    @media (max-width: 520px) {
      .app {
        grid-template-columns: 1fr;
        padding: 12px;
      }

      .board-shell,
      .side-panel {
        padding: 10px;
      }

      .board-footer {
        grid-template-columns: 1fr;
      }

      .space {
        --size: 32px;
        font-size: 13px;
      }

      .space.special-space {
        width: 52px;
        height: 32px;
        font-size: 11px;
      }

      .board-dice {
        padding: 6px;
        gap: 8px;
      }
      .board-dice .die {
        width: 34px;
        height: 34px;
        font-size: 20px;
      }

      .die {
        width: 48px;
        height: 48px;
      }
    }
  </style>
</head>

        <p class="subtitle">Pick a player, click a number on the board, choose a bid, then roll two dice. The winning number is the dice sum.</p>
      </div>
      <div class="actions">
        <button class="btn" id="newRoundBtn" type="button">New round</button>
        <button class="btn btn-danger" id="resetGameBtn" type="button">Reset game</button>
      </div>

    ];

    const players = [
      { id: 1, name: "Player 1", color: "#315f9f", balance: STARTING_BALANCE, bids: [] },
      { id: 2, name: "Player 2", color: "#177a4a", balance: STARTING_BALANCE, bids: [] },
      { id: 3, name: "Player 3", color: "#b3382c", balance: STARTING_BALANCE, bids: [] }
    ];

    let activePlayerId = 1;
    let pendingSpace = null;
    let pendingTokenPosition = null;
    let roundRolled = false;
    let lastRoll = null;
    let roundNumber = 1;

    const board = document.getElementById("board");
    const playersEl = document.getElementById("players");
    const activePlayerLabel = document.getElementById("activePlayerLabel");
    const tableTotal = document.getElementById("tableTotal");
    const sumLabel = document.getElementById("sumLabel");
    const rollBtn = document.getElementById("rollBtn");
    const roundResult = document.getElementById("roundResult");
    const dieOne = document.getElementById("dieOne");
    const dieTwo = document.getElementById("dieTwo");
    const newRoundBtn = document.getElementById("newRoundBtn");
    const resetGameBtn = document.getElementById("resetGameBtn");
    const logEl = document.getElementById("log");
    const modal = document.getElementById("bidModal");
    const bidForm = document.getElementById("bidForm");
    const bidTitle = document.getElementById("bidTitle");
    const bidContext = document.getElementById("bidContext");
    const bidOptions = document.getElementById("bidOptions");
    const bidError = document.getElementById("bidError");
    const cancelBidBtn = document.getElementById("cancelBidBtn");
    const boardScene = document.getElementById("boardScene");

    function money(value) {
      return `Rs. ${value.toLocaleString("en-IN")}`;
    }

    function activePlayer() {
      return players.find((player) => player.id === activePlayerId);
    }

    function totalOnTable() {
      return players.flatMap((player) => player.bids).reduce((sum, bid) => sum + bid.amount, 0);
    }

    function canRoll() {
      return !roundRolled && players.every((player) => player.bids.length > 0);
    }

    function getSpace(key) {
      return spaces.find((space) => space.key === key);
    }

    function isWinningSpace(space, sum) {
      if (space.type === "number") {
        return space.value === sum;
      }
      if (space.type === "under") {
        return sum < 7;
      }
      if (space.type === "over") {
        return sum > 7;
      }
      if (space.type === "even") {
        return sum % 2 === 0;
      }
      if (space.type === "odd") {
        return sum % 2 === 1;
      }
      return false;
    }

    function getBoardPoint(event) {
      const rect = board.getBoundingClientRect();
      return {
        x: ((event.clientX - rect.left) / rect.width) * 100,
        y: ((event.clientY - rect.top) / rect.height) * 100
      };
    }

    function createSpaces() {
      spaces.forEach((space) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `space${space.type === "number" ? "" : " special-space"}`;
        button.dataset.key = space.key;
        button.style.setProperty("--x", `${space.x}%`);
        button.style.setProperty("--y", `${space.y}%`);
        button.setAttribute("aria-label", `Place bid on ${space.label}, pays ${space.odds} for 1`);
        button.innerHTML = `<span class="space-label">${space.label}</span>`;
        button.addEventListener("click", (event) => openBidModal(space.key, event));
        boardScene.appendChild(button);
      });
    }

    function renderBidOptions() {
      const player = activePlayer();
      bidOptions.innerHTML = "";
      for (let multiplier = 1; multiplier <= 10; multiplier += 1) {
        const amount = multiplier * 1000;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "bid-option";
        button.textContent = String(multiplier);
        button.disabled = amount > player.balance;
        button.setAttribute("aria-label", `Bid ${money(amount)}`);
        button.addEventListener("click", () => {
          if (amount <= player.balance) {
            placeBid(amount, multiplier);
          }
        });
        bidOptions.appendChild(button);
      }
    }

    function openBidModal(spaceKey, event) {
      const player = activePlayer();
      const space = getSpace(spaceKey);
      if (roundRolled) {
        roundResult.textContent = "Start a new round before placing more bids.";
        return;
      }
      if (player.bids.length >= 3) {
        roundResult.textContent = `${player.name} already has three bids this round.`;
        return;
      }
      if (player.balance <= 0) {
        roundResult.textContent = `${player.name} has no balance left for this round.`;
        return;
      }

      pendingSpace = spaceKey;
      pendingTokenPosition = { x: space.x, y: space.y };
      bidTitle.textContent = "x1000";
      bidContext.textContent = `${player.name} on ${space.label}. Balance: ${money(player.balance)}. Payout: ${space.odds} for 1.`;
      bidError.textContent = "";
      renderBidOptions();
      modal.classList.add("open");
      bidOptions.querySelector("button:not(:disabled)")?.focus();
    }

    function closeBidModal() {
      modal.classList.remove("open");
      pendingSpace = null;
      pendingTokenPosition = null;
    }

    function placeBid(amount, multiplier) {
      const player = activePlayer();
      const space = getSpace(pendingSpace);
      const position = pendingTokenPosition || { x: space.x, y: space.y };
      const bid = {
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        spaceKey: pendingSpace,
        label: space.label,
        x: position.x,
        y: position.y,
        amount,
        multiplier,
        status: "pending",
        payout: 0
      };
      player.balance -= amount;
      player.bids.push(bid);

      closeBidModal();
      render();
    }

    function removePlacedBid(playerId, bidId) {
      if (roundRolled) return;
      const player = players.find((item) => item.id === playerId);
      if (!player) return;
      const index = player.bids.findIndex((bid) => bid.id === bidId && bid.status === "pending");
      if (index === -1) return;
      const [bid] = player.bids.splice(index, 1);
      player.balance += bid.amount;
      roundResult.textContent = `${player.name}'s bid on ${bid.label} was removed; ${money(bid.amount)} returned.`;
      render();
    }

    function rollDice() {
      if (!canRoll()) {
        roundResult.textContent = "Each player needs at least one bid before rolling.";
        return;
      }

      const first = Math.floor(Math.random() * 6) + 1;
      const second = Math.floor(Math.random() * 6) + 1;
      const sum = first + second;
      lastRoll = { first, second, sum };
      roundRolled = true;

      let winners = [];
      players.forEach((player) => {
        player.bids.forEach((bid) => {
          const space = getSpace(bid.spaceKey);
          if (isWinningSpace(space, sum)) {
            bid.status = "win";
            bid.payout = bid.amount * space.odds;
            player.balance += bid.payout;
            winners.push(`${player.name} wins ${money(bid.payout)} on ${space.label}`);
          } else {
            bid.status = "loss";
          }
        });
      });

      const logLine = winners.length
        ? `Round ${roundNumber}: rolled ${first} + ${second} = ${sum}. ${winners.join("; ")}.`
        : `Round ${roundNumber}: rolled ${first} + ${second} = ${sum}. No winning bids.`;
      addLog(logLine);
      render();
    }

    function addLog(text) {
      if (logEl.querySelector(".log-entry")?.textContent === "No rolls yet.") {
        logEl.innerHTML = "";
      }
      const entry = document.createElement("div");
      entry.className = "log-entry";
      entry.textContent = text;
      logEl.prepend(entry);
    }

    function newRound() {
      players.forEach((player) => {
        player.bids = [];
      });
      roundRolled = false;
      lastRoll = null;
      activePlayerId = 1;
      roundNumber += 1;
      render();
    }

    function resetGame() {
      players.forEach((player) => {
        player.balance = STARTING_BALANCE;
        player.bids = [];
      });
      activePlayerId = 1;
      pendingSpace = null;
      pendingTokenPosition = null;
      roundRolled = false;
      lastRoll = null;
      roundNumber = 1;
      logEl.innerHTML = '<div class="log-entry">No rolls yet.</div>';
      render();
    }

    function renderPlayers() {
      playersEl.innerHTML = "";
      players.forEach((player) => {
        const article = document.createElement("article");
        article.className = `player-card${player.id === activePlayerId ? " active" : ""}`;
        article.innerHTML = `
          <div class="player-head">
            <div>
              <div class="player-name">${player.name}</div>
              <div class="mini">${player.bids.length}/3 bids placed</div>
            </div>
            <div class="balance">${money(player.balance)}</div>
          </div>
          <div class="bid-list">
            ${player.bids.length ? player.bids.map((bid) => `
              <div class="bid-pill ${bid.status}">
                <span>${bid.label} for ${money(bid.amount)}</span>
                <strong>${bid.status === "win" ? `+${money(bid.payout)}` : bid.status === "loss" ? "lost" : `${getSpace(bid.spaceKey).odds}x`}</strong>
              </div>
            `).join("") : '<div class="mini">No bids yet</div>'}
          </div>
          <div class="player-actions">
            <button class="btn" type="button" data-player="${player.id}">Make active</button>
          </div>
        `;
        article.querySelector("button").addEventListener("click", () => {
          activePlayerId = player.id;
          render();
        });
        playersEl.appendChild(article);
      });
    }

    function renderSpaces() {
      document.querySelectorAll(".board-token").forEach((token) => token.remove());
      players.forEach((player) => {
        player.bids.forEach((bid, index) => {
          const space = getSpace(bid.spaceKey);
          const token = document.createElement("div");
          const offset = (index % 3) - 1;
          token.className = `board-token${bid.status === "win" ? " win" : ""}${!roundRolled && bid.status === "pending" ? " removable" : " locked"}`;
          token.style.setProperty("--player-color", player.color);
          token.style.setProperty("--x", `${bid.x + offset * 0.75}%`);
          token.style.setProperty("--y", `${bid.y + Math.floor(index / 3) * 0.75}%`);
          token.textContent = `P${player.id}`;
          token.setAttribute("role", "button");
          token.setAttribute("tabindex", !roundRolled && bid.status === "pending" ? "0" : "-1");
          token.setAttribute("aria-label", !roundRolled && bid.status === "pending"
            ? `Remove ${player.name}'s ${money(bid.amount)} bid on ${space.label}`
            : `${player.name} bid ${money(bid.amount)} on ${space.label}`);
          token.title = !roundRolled && bid.status === "pending" ? "Click to remove this bid and refund the stake" : `${player.name}: ${money(bid.amount)} on ${space.label}`;
          if (!roundRolled && bid.status === "pending") {
            const removeBid = () => removePlacedBid(player.id, bid.id);
            token.addEventListener("click", removeBid);
            token.addEventListener("keydown", (event) => {
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                removeBid();
              }
            });
          }
          boardScene.appendChild(token);
        });
      });

      document.querySelectorAll(".space").forEach((space) => {
        const boardSpace = getSpace(space.dataset.key);
        space.classList.toggle("is-winner", Boolean(lastRoll && isWinningSpace(boardSpace, lastRoll.sum)));
      });
    }

    function renderDice() {
      dieOne.textContent = lastRoll ? lastRoll.first : "-";
      dieTwo.textContent = lastRoll ? lastRoll.second : "-";
      sumLabel.textContent = lastRoll ? String(lastRoll.sum) : "Not rolled";

      if (!lastRoll) {
        roundResult.textContent = canRoll()
          ? "Ready to roll."
          : "Place at least one bid for each player to roll.";
        return;
      }

      const winningBids = players.flatMap((player) => player.bids.map((bid) => ({ player, bid }))).filter(({ bid }) => bid.status === "win");
      roundResult.textContent = winningBids.length
        ? `Winning space: ${lastRoll.sum}. ${winningBids.length} bid${winningBids.length === 1 ? "" : "s"} paid out.`
        : `Winning space: ${lastRoll.sum}. No one had that number.`;
    }

    function render() {
      activePlayerLabel.textContent = activePlayer().name;
      tableTotal.textContent = money(totalOnTable());
      rollBtn.disabled = !canRoll();
      renderPlayers();
      renderSpaces();
      renderDice();
    }

    bidForm.addEventListener("submit", (event) => {
      event.preventDefault();
    });

    cancelBidBtn.addEventListener("click", closeBidModal);
    modal.addEventListener("click", (event) => {
      if (event.target === modal) {
        closeBidModal();
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modal.classList.contains("open")) {
        closeBidModal();
      }
    });
    rollBtn.addEventListener("click", rollDice);
    newRoundBtn.addEventListener("click", newRound);
    resetGameBtn.addEventListener("click", resetGame);

    createSpaces();
    render();
  </script>
</body>
</html>
